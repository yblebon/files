<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0b3d45">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Files">
    <title>Secure Files</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; font-src 'self' data:; img-src data: blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none';">
    <style>
        :root {
            --bg:          #faf9f8;
            --surface:     #ffffff;
            --row-hover:   #f3f2f1;
            --border:      #e1dfdd;
            --border2:     #d2d0ce;
            --topbar-bg:   #0b3d45;
            --accent:      #0067b8;
            --accent-hover:#005a9e;
            --accent-dim:  rgba(0,103,184,0.08);
            --accent-dim2: rgba(0,103,184,0.14);
            --amber:       #ffb900;
            --amber-dim:   rgba(255,185,0,0.12);
            --red:         #d13438;
            --red-dim:     rgba(209,52,56,0.08);
            --green:       #107c41;
            --green-dim:   rgba(16,124,65,0.08);
            --text:        #201f1e;
            --muted:       #605e5c;
            --muted2:      #484644;
            --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        button, input { font-family: inherit; }

        /* ── App shell ── */
        .app-shell { display: flex; min-height: 100vh; }

        /* ── Sidebar ── */
        .sidebar {
            width: 260px; flex-shrink: 0; background: var(--bg);
            border-right: 1px solid var(--border);
            display: flex; flex-direction: column; gap: 18px;
            padding: 18px 14px; position: relative; z-index: 20;
        }
        .brand { display: flex; align-items: center; gap: 10px; padding: 0 2px; }
        .brand-icon {
            width: 32px; height: 32px; border-radius: 8px; background: var(--accent-dim);
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .brand-icon svg { width: 17px; height: 17px; fill: var(--accent); }
        .brand-text { flex: 1; min-width: 0; }
        #vaultTitle {
            font-size: 0.86rem; font-weight: 700; color: var(--text);
            background: transparent; border: none; outline: none; width: 100%;
            padding: 2px 0; border-bottom: 2px solid transparent; transition: border-color 0.2s;
        }
        #vaultTitle:focus { border-bottom-color: var(--accent); }
        .vault-subtitle { font-size: 0.68rem; color: var(--muted); margin-top: 1px; }

        .btn-upload {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            background: var(--accent); color: #fff; border: none; border-radius: 22px;
            padding: 10px 16px; font-size: 0.86rem; font-weight: 600; cursor: pointer;
            transition: background 0.15s, box-shadow 0.15s; box-shadow: 0 1px 2px rgba(0,0,0,0.12);
        }
        .btn-upload:hover { background: var(--accent-hover); }
        .btn-upload svg { width: 15px; height: 15px; fill: #fff; }

        .upload-panel {
            border: 1px solid var(--border); border-radius: 10px; padding: 12px;
            display: flex; flex-direction: column; gap: 8px; background: var(--surface);
        }
        .upload-panel[hidden] { display: none; }
        .upload-panel input.inp { font-size: 0.82rem; padding: 8px 10px; }
        .upload-drop {
            border: 1.5px dashed var(--border2); border-radius: 8px;
            padding: 14px 8px; text-align: center; color: var(--muted);
            cursor: pointer; transition: all 0.15s; background: var(--bg);
        }
        .upload-drop:hover, .upload-drop.dragging { border-color: var(--accent); background: var(--accent-dim); color: var(--accent); }
        .upload-drop input { display: none; }
        .ud-icon { font-size: 1.25rem; margin-bottom: 4px; }
        .ud-label { font-size: 0.76rem; font-weight: 600; }
        .ud-sub { font-size: 0.66rem; margin-top: 2px; }
        #sizeWarning { color: var(--red); font-size: 0.72rem; }

        input.inp {
            width: 100%; background: var(--surface); border: 1px solid var(--border2);
            border-radius: 6px; padding: 9px 12px; font-size: 0.86rem; color: var(--text);
            outline: none; transition: border-color 0.15s, box-shadow 0.15s;
        }
        input.inp::placeholder { color: #a19f9d; }
        input.inp:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-dim); }

        /* ── Side nav ── */
        .side-nav { display: flex; flex-direction: column; gap: 1px; }
        .nav-item {
            display: flex; align-items: center; gap: 11px; padding: 9px 10px;
            border-radius: 6px; border: none; background: none; color: var(--muted2);
            font-size: 0.86rem; font-weight: 500; cursor: pointer; text-align: left;
            transition: background 0.12s, color 0.12s; width: 100%;
        }
        .nav-item svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.6; flex-shrink: 0; }
        .nav-item:hover { background: var(--border); }
        .nav-item.active { background: var(--accent-dim2); color: var(--accent); font-weight: 700; }
        .nav-item.active svg { fill: var(--accent); stroke: var(--accent); }
        .nav-count { margin-left: auto; font-size: 0.72rem; color: var(--muted); font-weight: 500; }

        .sidebar-footer { margin-top: auto; display: flex; flex-direction: column; gap: 12px; }

        .storage-meter { font-size: 0.7rem; color: var(--muted); padding: 0 2px; }
        .storage-track { height: 5px; background: var(--border); border-radius: 99px; margin: 6px 0; overflow: hidden; }
        .storage-fill { height: 100%; background: var(--accent); border-radius: 99px; transition: width 0.3s, background 0.3s; }

        .vault-key-mini { border-top: 1px solid var(--border); padding-top: 12px; display: flex; flex-direction: column; gap: 8px; }
        .vk-label { font-size: 0.7rem; color: var(--muted); font-weight: 600; }
        .strength-track { height: 3px; background: var(--border); border-radius: 99px; margin-top: 6px; }
        .strength-fill { height: 100%; border-radius: 99px; transition: width 0.4s, background 0.3s; }
        .strength-label { font-size: 0.66rem; color: var(--muted); margin-top: 4px; display: block; }

        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        .btn-sm {
            display: flex; align-items: center; justify-content: center; gap: 6px;
            padding: 7px 8px; border-radius: 6px; border: 1px solid var(--border2);
            background: var(--surface); color: var(--muted2); font-size: 0.74rem; font-weight: 600;
            cursor: pointer; transition: all 0.15s; white-space: nowrap;
        }
        .btn-sm svg { width: 13px; height: 13px; flex-shrink: 0; }
        .btn-sm:hover { background: var(--row-hover); color: var(--text); }
        .btn-sm.danger { color: var(--red); border-color: rgba(209,52,56,0.25); }
        .btn-sm.danger:hover { background: var(--red-dim); }
        .btn-sm.success { color: var(--green); border-color: rgba(16,124,65,0.25); }
        .btn-sm.success:hover { background: var(--green-dim); }

        .sidebar-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 19; }
        .sidebar-backdrop.show { display: block; }
        .menu-toggle { display: none; background: none; border: none; color: #fff; padding: 6px; margin-right: 6px; cursor: pointer; flex-shrink: 0; }
        .menu-toggle svg { width: 20px; height: 20px; fill: currentColor; }

        /* ── Main ── */
        .main { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg); }

        .topbar { background: var(--topbar-bg); padding: 12px 24px; display: flex; align-items: center; flex-shrink: 0; }
        .search-wrap { position: relative; max-width: 680px; width: 100%; margin: 0 auto; }
        .search-wrap .si { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; fill: var(--muted); pointer-events: none; }
        #searchInput {
            width: 100%; background: #fff; border: none; border-radius: 20px;
            padding: 9px 16px 9px 40px; font-size: 0.86rem; color: var(--text);
            outline: none; box-shadow: 0 1px 2px rgba(0,0,0,0.18);
        }
        #searchInput::placeholder { color: #8a8886; }
        #searchInput:focus { box-shadow: 0 0 0 2px rgba(255,255,255,0.55); }

        .content { flex: 1; padding: 22px 28px 40px; overflow: auto; }
        .content-header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
        #viewTitle { font-size: 1.35rem; font-weight: 700; color: var(--text); }
        .main-stats { font-size: 0.8rem; color: var(--muted); white-space: nowrap; }

        /* ── Notice ── */
        .notice {
            display: flex; gap: 10px; align-items: flex-start;
            background: #fff4ce; border: 1px solid #ffd876;
            border-radius: 8px; padding: 11px 14px; font-size: 0.8rem;
            color: #6c5300; margin-bottom: 16px; line-height: 1.5;
        }
        .notice strong { color: #4d3900; }
        .notice-icon { font-size: 0.95rem; flex-shrink: 0; margin-top: 1px; }

        /* ── File table ── */
        #treeContainer { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: auto; }
        .file-table { width: 100%; border-collapse: collapse; font-size: 0.84rem; }
        .file-table thead th {
            position: sticky; top: 0; background: var(--surface); z-index: 1;
            text-align: left; font-size: 0.72rem; font-weight: 600;
            color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }
        .file-table thead th.sortable { cursor: pointer; user-select: none; transition: color 0.15s; }
        .file-table thead th.sortable:hover { color: var(--text); }
        .file-table thead th.sorted { color: var(--accent); }
        .sort-arrow { margin-left: 3px; font-size: 0.65rem; }
        .file-table tbody tr { border-bottom: 1px solid var(--border); transition: background 0.12s; }
        .file-table tbody tr:last-child { border-bottom: none; }
        .file-table tbody tr:hover { background: var(--row-hover); }
        .file-table td { padding: 8px 12px; vertical-align: middle; }
        .col-folder, .col-tags, .col-star { display: table-cell; }
        .col-star { width: 30px; padding-right: 0; }

        .star-btn { background: none; border: none; cursor: pointer; padding: 4px; display: flex; align-items: center; justify-content: center; border-radius: 5px; }
        .star-btn:hover { background: var(--border); }
        .star-btn svg { width: 16px; height: 16px; fill: none; stroke: var(--muted); stroke-width: 1.6; }
        .star-btn.active svg { fill: var(--amber); stroke: var(--amber); }

        .file-link {
            display: flex; align-items: center; gap: 8px; color: var(--text);
            text-decoration: none; font-size: 0.86rem; font-weight: 500;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            cursor: pointer; max-width: 220px;
        }
        .file-link svg { width: 16px; height: 16px; fill: var(--accent); flex-shrink: 0; }
        .file-link:hover { text-decoration: underline; }

        .folder-badge {
            display: inline-flex; align-items: center; gap: 6px;
            font-size: 0.76rem; color: var(--muted2);
            background: var(--bg); border: 1px solid var(--border2);
            border-radius: 6px; padding: 3px 9px; cursor: pointer;
            transition: all 0.15s; max-width: 160px;
        }
        .folder-badge svg { width: 12px; height: 12px; fill: var(--amber); flex-shrink: 0; }
        .folder-badge span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .folder-badge:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
        .folder-static { font-size: 0.76rem; color: var(--muted); }

        .file-meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
        .tag {
            font-size: 0.7rem; padding: 2px 8px; border-radius: 99px;
            background: var(--accent-dim); color: var(--accent);
            border: 1px solid rgba(0,103,184,0.18);
        }
        .timestamp { font-size: 0.8rem; color: var(--muted); white-space: nowrap; }

        .btn-xs {
            display: inline-flex; align-items: center; justify-content: center;
            padding: 5px 9px; border-radius: 6px; border: 1px solid transparent;
            font-size: 0.74rem; font-weight: 600;
            cursor: pointer; transition: all 0.15s; white-space: nowrap;
        }
        .btn-xs:active { transform: scale(0.96); }
        .bx-ghost  { background: var(--surface); border-color: var(--border2); color: var(--muted2); }
        .bx-ghost:hover { background: var(--row-hover); color: var(--text); }

        .kebab-btn { padding: 5px 7px; }
        .kebab-btn svg { width: 14px; height: 14px; fill: currentColor; }

        /* ── Row actions dropdown ── */
        .actions-menu {
            position: absolute; background: #fff; border: 1px solid var(--border2);
            border-radius: 8px; padding: 6px; min-width: 170px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.18);
            z-index: 10000; display: flex; flex-direction: column; gap: 1px;
            animation: menu-in 0.12s ease-out;
        }
        @keyframes menu-in { from { opacity:0; transform:translateY(-4px); } to { opacity:1; transform:none; } }
        .actions-menu-item {
            display: block; width: 100%; text-align: left; background: none; border: none;
            color: var(--text); font-size: 0.82rem;
            padding: 8px 10px; border-radius: 5px; cursor: pointer; transition: background 0.12s;
        }
        .actions-menu-item:hover { background: var(--row-hover); }
        .actions-menu-item.danger { color: var(--red); }
        .actions-menu-item.danger:hover { background: var(--red-dim); }

        /* ── Empty state ── */
        .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
        .empty-state-icon { font-size: 2.4rem; margin-bottom: 12px; opacity: 0.55; }
        .empty-state-title { font-size: 1rem; font-weight: 600; color: var(--muted2); margin-bottom: 6px; }
        .empty-state-sub { font-size: 0.82rem; }

        /* ── Modal ── */
        #modalOverlay {
            display: none; position: fixed; inset: 0;
            background: rgba(32,31,30,0.4);
            z-index: 9999; align-items: center; justify-content: center; padding: 20px;
        }
        #modalBox {
            background: #fff; border: 1px solid var(--border2); border-radius: 12px;
            padding: 26px; max-width: 420px; width: 100%;
            box-shadow: 0 24px 48px rgba(0,0,0,0.24);
            animation: modal-in 0.18s ease-out;
        }
        @keyframes modal-in { from { opacity:0; transform:scale(0.96) translateY(6px); } to { opacity:1; transform:none; } }
        #modalMessage { font-size: 0.92rem; line-height: 1.6; color: var(--text); margin-bottom: 16px; white-space: pre-wrap; }
        #modalInput { margin-bottom: 16px; }
        #modalActions { display: flex; gap: 8px; justify-content: flex-end; }
        .btn {
            display: inline-flex; align-items: center; gap: 7px;
            padding: 9px 16px; border-radius: 6px; border: none;
            font-size: 0.82rem; font-weight: 600;
            cursor: pointer; transition: all 0.15s; white-space: nowrap;
        }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-ghost { background: var(--surface); border: 1px solid var(--border2); color: var(--muted2); }
        .btn-ghost:hover { background: var(--row-hover); color: var(--text); }
        .btn-danger { background: var(--red); color: #fff; }
        .btn-danger:hover { background: #a4262c; }

        @media (max-width: 860px) {
            .menu-toggle { display: inline-flex; }
            .sidebar {
                position: fixed; left: 0; top: 0; bottom: 0; width: 260px;
                transform: translateX(-100%); transition: transform 0.2s ease; z-index: 20;
            }
            .sidebar.open { transform: translateX(0); box-shadow: 0 0 40px rgba(0,0,0,0.25); }
            .content { padding: 16px; }
            .col-folder, .col-tags { display: none; }
            .file-table { font-size: 0.78rem; }
            .file-table td { padding: 8px 6px; }
            .file-link { max-width: 140px; }
        }

        @media (max-width: 480px) {
            .col-modified { display: none; }
            .file-link { max-width: 110px; }
        }
    </style>
</head>
<body>

<div id="modalOverlay" role="presentation">
    <div id="modalBox" role="dialog" aria-modal="true" aria-labelledby="modalMessage">
        <p id="modalMessage"></p>
        <input type="text" id="modalInput" class="inp" style="display:none;" autocomplete="off" spellcheck="false" autocorrect="off">
        <div id="modalActions">
            <button id="modalCancel" class="btn btn-ghost" style="display:none;"></button>
            <button id="modalConfirm" class="btn btn-primary"></button>
        </div>
    </div>
</div>

<div class="sidebar-backdrop" id="sidebarBackdrop"></div>

<div class="app-shell">

    <aside class="sidebar" id="sidebar">
        <div class="brand">
            <div class="brand-icon">
                <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
            </div>
            <div class="brand-text">
                <input type="text" id="vaultTitle" value="Personal Secure Vault" spellcheck="false" autocomplete="off" maxlength="100">
                <div class="vault-subtitle">Offline · Client-side</div>
            </div>
        </div>

        <div>
            <button class="btn-upload" id="addFilesBtn" aria-expanded="false" aria-controls="uploadPanel">
                <svg viewBox="0 0 20 20" fill="currentColor"><path d="M10.75 4.75a.75.75 0 0 0-1.5 0v4.5h-4.5a.75.75 0 0 0 0 1.5h4.5v4.5a.75.75 0 0 0 1.5 0v-4.5h4.5a.75.75 0 0 0 0-1.5h-4.5v-4.5Z"/></svg>
                Add files
            </button>
            <div class="upload-panel" id="uploadPanel" hidden style="margin-top:8px;">
                <input type="text" id="folderPath" class="inp" placeholder="Folder path (e.g. Work/2026)">
                <input type="text" id="fileTags" class="inp" placeholder="Tags (e.g. invoice, pdf)">
                <div class="upload-drop" id="dropZone" onclick="document.getElementById('fileInput').click()">
                    <div class="ud-icon">📂</div>
                    <div class="ud-label">Click to browse</div>
                    <div class="ud-sub">or drag &amp; drop — encrypts &amp; stores immediately</div>
                    <input type="file" id="fileInput" multiple>
                </div>
                <div id="sizeWarning"></div>
            </div>
        </div>

        <nav class="side-nav" id="sideNav">
            <button class="nav-item active" data-view="files">
                <svg viewBox="0 0 20 20"><path d="M9.3 1.7a1 1 0 0 1 1.4 0l7 6.7c.2.2.3.4.3.7v8a1 1 0 0 1-1 1h-4.5a.5.5 0 0 1-.5-.5V13a2 2 0 0 0-4 0v4.9a.5.5 0 0 1-.5.5H3a1 1 0 0 1-1-1V9c0-.3.1-.5.3-.7Z"/></svg>
                Home
            </button>
            <button class="nav-item" data-view="files">
                <svg viewBox="0 0 20 20"><path d="M2 6a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6Z"/></svg>
                My files
            </button>
            <button class="nav-item" data-view="favorites">
                <svg viewBox="0 0 20 20"><path d="M10 1.6 12.5 7l6 .8-4.4 4.1 1.2 5.9L10 14.9 4.7 17.8l1.2-5.9L1.5 7.8l6-.8Z"/></svg>
                Favorites
                <span class="nav-count" id="favCount"></span>
            </button>
            <button class="nav-item" data-view="trash">
                <svg viewBox="0 0 20 20"><path d="M7 2h6l1 2h4v2H2V4h4Zm-2 5h10l-.8 10.1a2 2 0 0 1-2 1.9H7.8a2 2 0 0 1-2-1.9Z"/></svg>
                Recycle bin
                <span class="nav-count" id="trashCount"></span>
            </button>
        </nav>

        <div class="sidebar-footer">
            <div class="storage-meter">
                <span id="storageLabel">0 B of 100 MB used</span>
                <div class="storage-track"><div class="storage-fill" id="storageFill" style="width:0%"></div></div>
            </div>

            <div class="vault-key-mini">
                <div>
                    <div class="vk-label">Master password</div>
                    <input type="password" id="password" class="inp" placeholder="Enter master password…" autocomplete="current-password" oninput="updateStrength()">
                    <div class="strength-track"><div class="strength-fill" id="strengthBar" style="width:0%;background:var(--border)"></div></div>
                    <span class="strength-label" id="strengthLabel">Not set</span>
                </div>
                <div class="action-grid">
                    <button class="btn-sm success" onclick="downloadVault()">
                        <svg viewBox="0 0 20 20" fill="currentColor"><path d="M10.75 2.75a.75.75 0 0 0-1.5 0v8.614L6.295 8.235a.75.75 0 1 0-1.09 1.03l4.25 4.5a.75.75 0 0 0 1.09 0l4.25-4.5a.75.75 0 0 0-1.09-1.03l-2.955 3.129V2.75Z"/><path d="M3.5 12.75a.75.75 0 0 0-1.5 0v2.5A2.75 2.75 0 0 0 4.75 18h10.5A2.75 2.75 0 0 0 18 15.25v-2.5a.75.75 0 0 0-1.5 0v2.5c0 .69-.56 1.25-1.25 1.25H4.75c-.69 0-1.25-.56-1.25-1.25v-2.5Z"/></svg>
                        Export
                    </button>
                    <button class="btn-sm" onclick="triggerImport()">

<script>
'use strict';

const APP             = 'files';
const APP_VERSION     = '1.4.2';
const MAGIC_C         = new Uint8Array([0x56, 0x4C, 0x54, 0x02]);
const MAGIC_B         = new Uint8Array([0x56, 0x4C, 0x54, 0x01]);
const MAX_FILE_BYTES  = 50  * 1024 * 1024;
const MAX_VAULT_BYTES = 100 * 1024 * 1024;
const MIN_VAULT_BYTES = 48;

const FMT_MAGIC  = { saltStart: 4, saltEnd: 20, ivStart: 20, ivEnd: 32, cipherStart: 32 };
const FMT_LEGACY = { saltStart: 0, saltEnd: 16, ivStart: 16, ivEnd: 28, cipherStart: 28 };

let vaultFiles     = [];
let deferredPrompt = null;
let currentView    = 'files'; // 'files' | 'favorites' | 'trash'

// ── Modal ──────────────────────────────────────────────────────────────────
function showModal({ message, hasInput=false, inputType='text', placeholder='', defaultValue='',
                     confirmLabel='OK', cancelLabel=null, isDanger=false }) {
    return new Promise(resolve => {
        const overlay    = document.getElementById('modalOverlay');
        const msgEl      = document.getElementById('modalMessage');
        const inputEl    = document.getElementById('modalInput');
        const confirmBtn = document.getElementById('modalConfirm');
        const cancelBtn  = document.getElementById('modalCancel');

        msgEl.textContent  = message;
        inputEl.style.display = hasInput ? 'block' : 'none';
        inputEl.type = inputType;
        if (hasInput) { inputEl.placeholder = placeholder; inputEl.value = defaultValue; }

        confirmBtn.textContent = confirmLabel;
        confirmBtn.className   = isDanger ? 'btn btn-danger' : 'btn btn-primary';

        if (cancelLabel) { cancelBtn.style.display = 'inline-flex'; cancelBtn.textContent = cancelLabel; }
        else               cancelBtn.style.display = 'none';

        overlay.style.display = 'flex';

        const prevFocus = document.activeElement;
        setTimeout(() => (hasInput ? inputEl : confirmBtn).focus(), 60);

        function handleTrap(e) {
            if (e.key !== 'Tab') return;
            const focusable = [...document.getElementById('modalBox')
                .querySelectorAll('button:not([disabled]),input:not([disabled])')]
                .filter(el => el.style.display !== 'none');
            const first = focusable[0], last = focusable[focusable.length - 1];
            if (e.shiftKey) {
                if (document.activeElement === first) { e.preventDefault(); last.focus(); }
            } else {
                if (document.activeElement === last) { e.preventDefault(); first.focus(); }
            }
        }
        overlay.addEventListener('keydown', handleTrap);

        function close(result) {
            overlay.style.display = 'none';
            overlay.removeEventListener('keydown', handleTrap);
            confirmBtn.onclick = cancelBtn.onclick = inputEl.onkeydown = null;
            prevFocus?.focus();
            resolve(result);
        }
        confirmBtn.onclick = () => close(hasInput ? inputEl.value : true);
        cancelBtn.onclick  = () => close(hasInput ? null : false);
        inputEl.onkeydown  = e => { if (e.key==='Enter') confirmBtn.click(); if (e.key==='Escape') cancelBtn.click(); };
    });
}

const modalAlert   = msg                           => showModal({ message: msg, confirmLabel: 'Got it' });
const modalConfirm = (msg, confirmLabel, isDanger) => showModal({ message: msg, confirmLabel, cancelLabel: 'Cancel', isDanger: !!isDanger });
const modalPrompt  = (msg, defaultValue, placeholder) => showModal({ message: msg, hasInput: true, defaultValue: defaultValue||'', placeholder: placeholder||'', confirmLabel: 'OK', cancelLabel: 'Cancel' });
const modalPromptPassword = (msg, placeholder) => showModal({ message: msg, hasInput: true, inputType: 'password', placeholder: placeholder||'', confirmLabel: 'Unlock', cancelLabel: 'Cancel' });

// ── Sidebar (mobile drawer + nav + upload panel) ───────────────────────────
const sidebar         = document.getElementById('sidebar');
const sidebarBackdrop = document.getElementById('sidebarBackdrop');
document.getElementById('menuToggle').addEventListener('click', () => openSidebar());
sidebarBackdrop.addEventListener('click', () => closeSidebar());
function openSidebar()  { sidebar.classList.add('open'); sidebarBackdrop.classList.add('show'); }
function closeSidebar() { sidebar.classList.remove('open'); sidebarBackdrop.classList.remove('show'); }

const addFilesBtn = document.getElementById('addFilesBtn');
const uploadPanel = document.getElementById('uploadPanel');
addFilesBtn.addEventListener('click', () => {
    const willOpen = uploadPanel.hidden;
    uploadPanel.hidden = !willOpen;
    addFilesBtn.setAttribute('aria-expanded', String(willOpen));

});

document.getElementById('sideNav').addEventListener('click', e => {
    const btn = e.target.closest('.nav-item');

});

function setView(view) {
    currentView = view;
    document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.view === view));
    const titles = { files: 'My files', favorites: 'Favorites', trash: 'Recycle bin' };
    document.getElementById('viewTitle').textContent = titles[view] || 'My files';
    sortKey = view === 'trash' ? 'trashedAt' : 'modified';
    sortDir = 'desc';
    document.getElementById('searchInput').value = '';
    renderTree();
}

// ── Drag & Drop ────────────────────────────────────────────────────────────
// Selecting or dropping files encrypts & stores them immediately — there's
// no separate "confirm" step, since a picked file is always meant to go in.
const dropZone  = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
fileInput.addEventListener('change', () => { if (fileInput.files.length) addFile(); });
['dragenter','dragover'].forEach(ev => dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.add('dragging'); }));
['dragleave','drop'].forEach(ev => dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.remove('dragging'); }));
dropZone.addEventListener('drop', e => {
    if (e.dataTransfer.files.length) {
        fileInput.files = e.dataTransfer.files;
        addFile();
    }
});

// ── PWA ────────────────────────────────────────────────────────────────────
function setupPWA() {
    const manifest = {
        name:'Secure Vault Pro', short_name:'Vault', start_url:'.', display:'standalone',
        background_color:'#faf9f8', theme_color:'#0b3d45',

            sizes:'192x192', type:'image/svg+xml'
        }]
    };
    const manifestBlob = new Blob([JSON.stringify(manifest)], {type:'application/json'});
    const manifestURL  = URL.createObjectURL(manifestBlob);
    const link = Object.assign(document.createElement('link'), { rel:'manifest', href: manifestURL });
    document.head.appendChild(link);

    window.addEventListener('beforeinstallprompt', e => {

document.getElementById('installBtn').addEventListener('click', () => {

// ── Utilities ──────────────────────────────────────────────────────────────
function formatBytes(b) {
    if (b === 0) return '0 B';
    if (!b || b < 0) return '';
    const k=1024, s=['B','KB','MB','GB'], i=Math.floor(Math.log(b)/Math.log(k));
    return parseFloat((b/Math.pow(k,i)).toFixed(1))+' '+s[i];
}

function updateStorageMeter() {
    const total = vaultFiles.reduce((s,f)=>s+(f.size||0),0);
    const pct   = Math.min(100, (total / MAX_VAULT_BYTES) * 100);
    document.getElementById('storageFill').style.width = pct + '%';
    document.getElementById('storageFill').style.background = pct > 90 ? 'var(--red)' : 'var(--accent)';
    document.getElementById('storageLabel').textContent = `${formatBytes(total)} of ${formatBytes(MAX_VAULT_BYTES)} used`;
}

function updateNavCounts() {
    const favN   = vaultFiles.filter(f => f.favorite && !f.trashed).length;
    const trashN = vaultFiles.filter(f => f.trashed).length;
    document.getElementById('favCount').textContent   = favN   ? favN   : '';
    document.getElementById('trashCount').textContent = trashN ? trashN : '';
}

function formatDate(ts) {
    if (!ts) return '';
    const d = new Date(ts);
    return isNaN(d.getTime()) ? '' : d.toLocaleString();
}

// Mirrors `date -u +%Y%m%dT%H%MZ` — used for the backup filename below.
function utcTimestamp() {
    const d   = new Date();
    const pad = n => String(n).padStart(2, '0');
    return `${d.getUTCFullYear()}${pad(d.getUTCMonth()+1)}${pad(d.getUTCDate())}T${pad(d.getUTCHours())}${pad(d.getUTCMinutes())}Z`;
}

// ── FIX #1: Data URL → Blob download ──────────────────────────────────────
// Browsers silently block data: URL downloads for files > ~2MB.
// Convert on demand to a blob URL, trigger click, then revoke.
function dataURLToBlob(dataURL) {
    const comma = dataURL.indexOf(',');
    if (comma === -1) throw new Error('Invalid data URL');
    const meta   = dataURL.slice(0, comma);                     // "data:mime/type;base64"
    const b64    = dataURL.slice(comma + 1);
    const mime   = (meta.match(/:(.*?);/) || [])[1] || 'application/octet-stream';
    const bstr   = atob(b64);
    const arr    = new Uint8Array(bstr.length);
    for (let i = 0; i < bstr.length; i++) arr[i] = bstr.charCodeAt(i);
    return new Blob([arr], { type: mime });
}

function downloadDataURL(dataURL, filename) {
    try {
        const blob    = dataURLToBlob(dataURL);
        const blobURL = URL.createObjectURL(blob);
        const a = Object.assign(document.createElement('a'), { href: blobURL, download: filename });
        a.click();
        setTimeout(() => URL.revokeObjectURL(blobURL), 10000);
    } catch {
        // Last-resort fallback — works only for very small files
        const a = Object.assign(document.createElement('a'), { href: dataURL, download: filename });
        a.click();
    }
}

// ── Crypto ─────────────────────────────────────────────────────────────────
const _keyCache = new Map();
function _clearKeyCache() { _keyCache.clear(); }

async function deriveKey(password, salt) {
    const saltHex  = Array.from(salt).map(b => b.toString(16).padStart(2,'0')).join('');
    const cacheKey = `${password}::${saltHex}`;
    if (_keyCache.has(cacheKey)) return _keyCache.get(cacheKey);
    const raw = await crypto.subtle.importKey(
        'raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']
    );
    const key = await crypto.subtle.deriveKey(
        { name:'PBKDF2', salt, iterations:600000, hash:'SHA-256' },
        raw,
        { name:'AES-GCM', length:256 },
        false,
        ['encrypt','decrypt']
    );
    if (_keyCache.size >= 10) _keyCache.delete(_keyCache.keys().next().value);
    _keyCache.set(cacheKey, key);
    return key;
}

function buildAAD(magicBytes, salt) {
    const aad = new Uint8Array(magicBytes.length + salt.length);
    aad.set(magicBytes, 0);
    aad.set(salt, magicBytes.length);
    return aad;
}

function matchesMagic(header, magic) {
    return header.length >= 4 && magic.every((b, i) => b === header[i]);
}

async function tryDecrypt(password, buf) {
    const header = new Uint8Array(buf.slice(0, 4));

    if (matchesMagic(header, MAGIC_C)) {
        const salt   = new Uint8Array(buf.slice(FMT_MAGIC.saltStart, FMT_MAGIC.saltEnd));
        const iv     = new Uint8Array(buf.slice(FMT_MAGIC.ivStart,   FMT_MAGIC.ivEnd));
        const cipher = buf.slice(FMT_MAGIC.cipherStart);
        const key    = await deriveKey(password, salt);
        return crypto.subtle.decrypt({ name:'AES-GCM', iv, additionalData: buildAAD(MAGIC_C, salt) }, key, cipher);
    }

    if (matchesMagic(header, MAGIC_B)) {
        const salt   = new Uint8Array(buf.slice(FMT_MAGIC.saltStart, FMT_MAGIC.saltEnd));
        const iv     = new Uint8Array(buf.slice(FMT_MAGIC.ivStart,   FMT_MAGIC.ivEnd));
        const cipher = buf.slice(FMT_MAGIC.cipherStart);
        const key    = await deriveKey(password, salt);
        return crypto.subtle.decrypt({ name:'AES-GCM', iv }, key, cipher);
    }

    // Format A (legacy, no magic header)
    const salt   = new Uint8Array(buf.slice(FMT_LEGACY.saltStart, FMT_LEGACY.saltEnd));
    const iv     = new Uint8Array(buf.slice(FMT_LEGACY.ivStart,   FMT_LEGACY.ivEnd));
    const cipher = buf.slice(FMT_LEGACY.cipherStart);
    const key    = await deriveKey(password, salt);
    return crypto.subtle.decrypt({ name:'AES-GCM', iv }, key, cipher);
}

// ── Strength ───────────────────────────────────────────────────────────────
function updateStrength() {
    const pwd   = document.getElementById('password').value;
    const bar   = document.getElementById('strengthBar');
    const label = document.getElementById('strengthLabel');
    if (!pwd) { bar.style.cssText='width:0%;background:var(--border)'; label.textContent='Not set'; label.style.color='var(--muted)'; return; }
    let score = 0;
    if (pwd.length >= 12) score++; if (pwd.length >= 16) score++;
    if (/[A-Z]/.test(pwd) && /[a-z]/.test(pwd)) score++;
    if (/[0-9]/.test(pwd)) score++; if (/[^A-Za-z0-9]/.test(pwd)) score++;
    const s = Math.min(score, 4);
    const colors  = ['var(--border)','#d13438','#f7630c','#c19c00','#107c41'];
    const labels  = ['Too short','Weak','Fair','Good','Strong'];
    bar.style.width      = s * 25 + '%';
    bar.style.background = colors[s];
    label.textContent    = labels[s];
    label.style.color    = colors[s];
}

// ── Reset ──────────────────────────────────────────────────────────────────
function resetUI() {
    document.getElementById('vaultTitle').value = 'Personal Secure Vault';
    ['searchInput','folderPath','fileTags','password','vaultUpload','fileInput']
        .forEach(id => { document.getElementById(id).value = ''; });
    document.getElementById('sizeWarning').textContent = '';
    uploadPanel.hidden = true;
    addFilesBtn.setAttribute('aria-expanded', 'false');
    setView('files');
    updateStrength();
}

// ── Add files ──────────────────────────────────────────────────────────────
function readFileAsDataURL(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload  = e => resolve(e.target.result);
        reader.onerror = () => reject(new Error(`Failed to read "${file.name}"`));
        reader.readAsDataURL(file);
    });
}

async function addFile() {
    document.getElementById('sizeWarning').textContent = '';
    if (!fileInput.files.length) { await modalAlert('Select at least one file first.'); return; }

    const path  = document.getElementById('folderPath').value.trim() || 'Root';
    const tags  = document.getElementById('fileTags').value.split(',').map(t=>t.trim()).filter(Boolean);
    const files = Array.from(fileInput.files);

    for (const f of files) {
        if (f.size > MAX_FILE_BYTES) {
            await modalAlert(`"${f.name}" is ${formatBytes(f.size)}, which exceeds the 50 MB per-file limit.`);
            return;
        }
    }

    const currentTotal = vaultFiles.reduce((s,f) => s + (f.size || 0), 0);
    const incoming     = files.reduce((s,f) => s + f.size, 0);
    if (currentTotal + incoming > MAX_VAULT_BYTES) {
        document.getElementById('sizeWarning').textContent =
            `Adding ${formatBytes(incoming)} would exceed the 100 MB vault limit. Current vault: ${formatBytes(currentTotal)}.`;
        return;
    }

    try {
        const dataURLs = await Promise.all(files.map(readFileAsDataURL));
        const now      = new Date().toISOString();
        dataURLs.forEach((content, i) => {
            vaultFiles.push({
                id:        crypto.randomUUID(),
                name:      files[i].name,
                path,
                tags:      [...tags],
                content,
                modified:  now,
                size:      files[i].size,
                favorite:  false,
                trashed:   false,
                trashedAt: null
            });
        });
        if (currentView !== 'files') setView('files'); else { document.getElementById('searchInput').value = ''; renderTree(); }
        fileInput.value = '';
        await modalAlert(`✅ ${files.length} file${files.length!==1?'s':''} added to "${path}".`);
    } catch (err) {
        await modalAlert(`❌ Error reading files: ${err.message}`);
    }
}

// ── File ops ───────────────────────────────────────────────────────────────
async function renameFile(id) {
    const f = vaultFiles.find(x => x.id === id);
    if (!f) return;
    const n = await modalPrompt('New filename:', f.name);
    if (n !== null && n.trim() && n.trim() !== f.name) {
        f.name = n.trim(); f.modified = new Date().toISOString(); renderTree();
    }
}
async function editTags(id) {
    const f = vaultFiles.find(x => x.id === id);
    if (!f) return;
    const s = await modalPrompt('Tags (comma-separated):', f.tags.join(', '));
    if (s !== null) {
        f.tags = s.split(',').map(t => t.trim()).filter(Boolean);
        f.modified = new Date().toISOString(); renderTree();
    }
}
async function moveFile(id) {
    const f = vaultFiles.find(x => x.id === id);
    if (!f) return;
    const p = await modalPrompt('New folder path:', f.path);
    if (p !== null && p.trim() !== f.path) {
        f.path = normalisePath(p); f.modified = new Date().toISOString(); renderTree();
    }
}
function toggleFavorite(id) {
    const f = vaultFiles.find(x => x.id === id);
    if (!f) return;
    f.favorite = !f.favorite;
    renderTree();
}
// Soft-delete: files move to the Recycle Bin and can be restored, so this
// needs no confirmation — unlike the permanent delete below.
function trashFile(id) {
    const f = vaultFiles.find(x => x.id === id);
    if (!f) return;
    f.trashed = true; f.trashedAt = new Date().toISOString();
    renderTree();
}
function restoreFile(id) {
    const f = vaultFiles.find(x => x.id === id);
    if (!f) return;
    f.trashed = false; f.trashedAt = null; f.modified = new Date().toISOString();
    renderTree();
}
async function deleteForever(id) {
    const f = vaultFiles.find(x => x.id === id);
    if (!f) return;
    if (await modalConfirm(`Permanently delete "${f.name}"? This can't be undone.`, 'Delete forever', true)) {
        vaultFiles = vaultFiles.filter(x => x.id !== id); renderTree();
    }
}
async function renameFolderPrompt(folderPath) {
    const oldName = folderPath.split('/').pop();
    const newName = await modalPrompt(`Rename "${oldName}" to:`, oldName);
    if (!newName || newName.trim() === oldName) return;
    const newPath = [...folderPath.split('/').slice(0,-1), newName.trim()].join('/');
    vaultFiles.forEach(f => {
        if (f.path === folderPath) {
            f.path = newPath;
        } else if (f.path.startsWith(folderPath + '/')) {
            f.path = newPath + f.path.slice(folderPath.length);
        } else { return; }
        f.modified = new Date().toISOString();
    });
    renderTree();
}
async function closeVault() {
    if (!await modalConfirm('Close vault and clear all files from memory?', 'Close & Clear', true)) return;
    vaultFiles = []; _clearKeyCache(); resetUI(); renderTree();
    await modalAlert('✅ Vault closed. Memory cleared.');
}

// ── Path helpers ───────────────────────────────────────────────────────────
// Normalise to "Seg1/Seg2/…" — strips leading/trailing slashes, collapses
// doubles, and falls back to 'Root' for empty results.
function normalisePath(raw) {
    const parts = String(raw || '').split('/').map(s => s.trim()).filter(Boolean);
    return parts.length ? parts.join('/') : 'Root';
}

// ── FIX #6: Vault schema validation with full field sanitisation ──────────
// - Tags must all be strings (non-string elements would crash search)
// - id must be a non-empty string (missing id breaks all CRUD operations)
// - size defaults to 0 if missing so vault-limit maths stay correct
// - path is normalised so Move prompt never shows an empty string
// - modified defaults to now so the timestamp column is never blank
// - title from metadata is type-checked before being written to the DOM
const ALLOWED_CONTENT_PREFIXES = ['data:'];
function isValidFileEntry(entry) {
    if (!entry || typeof entry !== 'object') return false;
    if (typeof entry.name !== 'string' || !entry.name.trim()) return false;
    if (typeof entry.content !== 'string') return false;
    if (!ALLOWED_CONTENT_PREFIXES.some(p => entry.content.startsWith(p))) return false;
    // base64 expands 3 bytes → 4 chars; add slack for the data-URI header (~100 chars)
    if (entry.content.length > Math.ceil(MAX_FILE_BYTES * 4 / 3) + 100) return false;
    return true;
}

function sanitiseEntry(entry) {
    return {
        // FIX #3: assign fresh UUID if id is missing or wrong type
        id:        (typeof entry.id === 'string' && entry.id) ? entry.id : crypto.randomUUID(),
        name:      entry.name.trim(),
        // FIX #9: normalise path so Move prompt is never blank
        path:      normalisePath(entry.path),
        // FIX #4: filter non-string tags so search can't crash on .toLowerCase()
        tags:      Array.isArray(entry.tags)
                       ? entry.tags.filter(t => typeof t === 'string').map(t => t.trim()).filter(Boolean)
                       : [],
        content:   entry.content,
        // FIX #10: default missing/invalid modified to import timestamp
        modified:  (entry.modified && !isNaN(new Date(entry.modified).getTime()))
                       ? entry.modified
                       : new Date().toISOString(),
        // FIX #8: default missing/invalid size to 0 so vault-limit check is correct
        size:      (Number.isFinite(entry.size) && entry.size >= 0) ? entry.size : 0,
        favorite:  entry.favorite === true,
        trashed:   entry.trashed === true,
        trashedAt: (entry.trashedAt && !isNaN(new Date(entry.trashedAt).getTime())) ? entry.trashedAt : null,
    };
}

// ── FIX #11: Hoist static render helpers out of renderTree ────────────────
// Redefining these on every render allocates fresh closures and SVG strings
// on each call — wasteful for vaults with many files.
const FILE_ICON_HTML   = `<svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4 4a2 2 0 0 1 2-2h4.586A2 2 0 0 1 12 2.586L15.414 6A2 2 0 0 1 16 7.414V16a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4Zm2 6a1 1 0 0 1 1-1h6a1 1 0 1 1 0 2H7a1 1 0 0 1-1-1Zm1 3a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2H7Z" clip-rule="evenodd"/></svg>`;
const FOLDER_ICON_HTML = `<svg viewBox="0 0 20 20" fill="currentColor"><path d="M2 6a2 2 0 0 1 2-2h4l2 2h4a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6Z"/></svg>`;
const KEBAB_ICON_HTML   = `<svg viewBox="0 0 20 20"><circle cx="10" cy="4"  r="1.6"/><circle cx="10" cy="10" r="1.6"/><circle cx="10" cy="16" r="1.6"/></svg>`;
const STAR_ICON_HTML    = `<svg viewBox="0 0 20 20"><path d="M10 1.6 12.5 7l6 .8-4.4 4.1 1.2 5.9L10 14.9 4.7 17.8l1.2-5.9L1.5 7.8l6-.8Z"/></svg>`;

function getTableColumns() {
    const cols = [];
    if (currentView !== 'trash') cols.push({ key: null, label: '', cls: 'col-star' });
    cols.push({ key: 'name', label: 'Name' });
    cols.push({ key: 'path', label: 'Folder', cls: 'col-folder' });
    cols.push({ key: null,   label: 'Tags',   cls: 'col-tags' });
    cols.push(currentView === 'trash'
        ? { key: 'trashedAt', label: 'Deleted',  cls: 'col-modified' }
        : { key: 'modified',  label: 'Modified', cls: 'col-modified' });
    cols.push({ key: 'size', label: 'Size' });
    cols.push({ key: null,   label: '' });
    return cols;
}

let sortKey = 'modified';
let sortDir = 'desc';

function setSort(key) {
    if (sortKey === key) sortDir = sortDir === 'asc' ? 'desc' : 'asc';
    else { sortKey = key; sortDir = (key === 'name' || key === 'path') ? 'asc' : 'desc'; }
    renderTree();
}

function compareFiles(a, b) {
    let av, bv;
    if (sortKey === 'size') { av = a.size || 0; bv = b.size || 0; }
    else if (sortKey === 'modified' || sortKey === 'trashedAt') {
        av = new Date(a[sortKey]).getTime() || 0; bv = new Date(b[sortKey]).getTime() || 0;
    } else { av = String(a[sortKey] || '').toLowerCase(); bv = String(b[sortKey] || '').toLowerCase(); }
    if (av < bv) return sortDir === 'asc' ? -1 : 1;
    if (av > bv) return sortDir === 'asc' ? 1 : -1;
    return 0;
}

// ── Row actions dropdown (replaces per-row inline buttons) ────────────────
let _openMenu = null;
function closeOpenMenu() {
    if (!_openMenu) return;
    _openMenu.remove();
    _openMenu = null;
    document.removeEventListener('click', _closeMenuOnOutsideClick, true);
    document.removeEventListener('keydown', _closeMenuOnEscape, true);
}
function _closeMenuOnOutsideClick(e) { if (_openMenu && !_openMenu.contains(e.target)) closeOpenMenu(); }
function _closeMenuOnEscape(e) { if (e.key === 'Escape') closeOpenMenu(); }

function openActionsMenu(anchorBtn, file) {
    closeOpenMenu();
    const menu = document.createElement('div');
    menu.className = 'actions-menu';

    const items = currentView === 'trash'
        ? [
            { label: 'Restore',            fn: () => restoreFile(file.id) },
            { label: 'Delete permanently', fn: () => deleteForever(file.id), danger: true },
          ]
        : [
            { label: 'Move',      fn: () => moveFile(file.id)   },
            { label: 'Edit tags', fn: () => editTags(file.id)   },
            { label: 'Rename',    fn: () => renameFile(file.id) },
            { label: file.favorite ? 'Remove from favorites' : 'Add to favorites', fn: () => toggleFavorite(file.id) },
            { label: 'Delete',    fn: () => trashFile(file.id), danger: true },
          ];

    items.forEach(({ label, fn, danger }) => {
        const item = document.createElement('button');
        item.className = 'actions-menu-item' + (danger ? ' danger' : '');
        item.textContent = label;
        item.addEventListener('click', () => { closeOpenMenu(); fn(); });
        menu.appendChild(item);
    });
    document.body.appendChild(menu);

    const rect = anchorBtn.getBoundingClientRect();
    menu.style.top  = `${rect.bottom + window.scrollY + 4}px`;
    const left = rect.right + window.scrollX - menu.offsetWidth;
    menu.style.left = `${Math.max(8, left)}px`;

    _openMenu = menu;
    setTimeout(() => {
        document.addEventListener('click', _closeMenuOnOutsideClick, true);
        document.addEventListener('keydown', _closeMenuOnEscape, true);
    }, 0);
}

function buildTableHead() {
    const thead = document.createElement('thead');
    const tr    = document.createElement('tr');
    getTableColumns().forEach(col => {
        const th = document.createElement('th');
        if (col.cls) th.classList.add(col.cls);
        if (col.key) {
            th.classList.add('sortable');
            if (sortKey === col.key) th.classList.add('sorted');
            th.addEventListener('click', () => setSort(col.key));
            th.textContent = col.label;
            if (sortKey === col.key) {
                const arrow = document.createElement('span');
                arrow.className = 'sort-arrow';
                arrow.textContent = sortDir === 'asc' ? '↑' : '↓';
                th.appendChild(arrow);
            }
        } else {
            th.textContent = col.label;
        }
        tr.appendChild(th);
    });
    thead.appendChild(tr);
    return thead;
}

function makeFileRow(file) {
    const tr = document.createElement('tr');

    if (currentView !== 'trash') {
        const starTd = document.createElement('td'); starTd.className = 'col-star';
        const starBtn = document.createElement('button');
        starBtn.className = 'star-btn' + (file.favorite ? ' active' : '');
        starBtn.title = file.favorite ? 'Remove from favorites' : 'Add to favorites';
        starBtn.innerHTML = STAR_ICON_HTML;
        starBtn.addEventListener('click', () => toggleFavorite(file.id));
        starTd.appendChild(starBtn);
        tr.appendChild(starTd);
    }

    // Name — FIX #1: don't set link.href to the data URL at render time.
    // For files > ~2MB browsers silently block data-URL navigation.
    // Instead, generate a short-lived blob URL on click and revoke it.
    const nameTd = document.createElement('td');
    const link = document.createElement('a'); link.className = 'file-link';
    link.title = file.name;
    link.setAttribute('role', 'button');
    link.innerHTML = FILE_ICON_HTML;
    const ns = document.createElement('span'); ns.textContent = file.name; link.appendChild(ns);
    link.addEventListener('click', e => { e.preventDefault(); downloadDataURL(file.content, file.name); });
    nameTd.appendChild(link);

    // Folder — clicking it renames every file sharing this folder path.
    // Disabled from the Recycle Bin, since it would silently touch
    // non-trashed files sharing the same path.
    const folderTd = document.createElement('td'); folderTd.className = 'col-folder';
    if (currentView === 'trash') {
        const staticLabel = document.createElement('span');
        staticLabel.className = 'folder-static';
        staticLabel.textContent = file.path;
        folderTd.appendChild(staticLabel);
    } else {
        const folderBtn = document.createElement('button');
        folderBtn.className = 'folder-badge';
        folderBtn.title = `Rename the "${file.path}" folder`;
        folderBtn.innerHTML = FOLDER_ICON_HTML;
        const folderLabel = document.createElement('span'); folderLabel.textContent = file.path;
        folderBtn.appendChild(folderLabel);
        folderBtn.addEventListener('click', () => renameFolderPrompt(file.path));
        folderTd.appendChild(folderBtn);
    }

    // Tags
    const tagsTd = document.createElement('td'); tagsTd.className = 'col-tags';
    const meta = document.createElement('div'); meta.className = 'file-meta';
    // FIX #4: tags are always strings (sanitised on import / add), but guard
    // with String(t) here too so a stale in-memory entry can't crash render.
    file.tags.forEach(t => {
        const tag = document.createElement('span'); tag.className = 'tag'; tag.textContent = String(t); meta.appendChild(tag);
    });
    tagsTd.appendChild(meta);

    // Modified / Deleted
    const modTd = document.createElement('td'); modTd.className = 'timestamp col-modified';
    modTd.textContent = formatDate(currentView === 'trash' ? file.trashedAt : file.modified);

    // Size
    const sizeTd = document.createElement('td'); sizeTd.className = 'timestamp';
    sizeTd.textContent = file.size ? formatBytes(file.size) : '—';

    // Actions
    const actionsTd = document.createElement('td');
    const kebab = document.createElement('button');
    kebab.className = 'btn-xs bx-ghost kebab-btn';
    kebab.innerHTML = KEBAB_ICON_HTML;
    kebab.title = 'File actions';
    kebab.setAttribute('aria-haspopup', 'true');
    kebab.addEventListener('click', e => { e.stopPropagation(); openActionsMenu(kebab, file); });
    actionsTd.appendChild(kebab);

    tr.append(nameTd, folderTd, tagsTd, modTd, sizeTd, actionsTd);
    return tr;
}

function getViewFiles() {
    if (currentView === 'trash')     return vaultFiles.filter(f => f.trashed);
    if (currentView === 'favorites') return vaultFiles.filter(f => f.favorite && !f.trashed);
    return vaultFiles.filter(f => !f.trashed);
}

const EMPTY_STATES = {
    files:     { icon: '🗄️', title: 'This vault is empty',   sub: 'Use "Add files" in the sidebar, or import an existing vault' },
    favorites: { icon: '⭐',  title: 'No favorites yet',       sub: 'Star a file to see it here' },
    trash:     { icon: '🗑️', title: 'Recycle bin is empty',   sub: 'Deleted files show up here and can be restored' },
};

// ── Render file table ──────────────────────────────────────────────────────
function renderTree() {
    const container = document.getElementById('treeContainer');
    const search    = document.getElementById('searchInput').value.toLowerCase().trim();
    closeOpenMenu();
    container.innerHTML = '';
    updateStorageMeter();
    updateNavCounts();

    const viewFiles = getViewFiles();

    if (!viewFiles.length) {
        const state = EMPTY_STATES[currentView] || EMPTY_STATES.files;
        const e = document.createElement('div'); e.className = 'empty-state';
        e.innerHTML = `<div class="empty-state-icon">${state.icon}</div><div class="empty-state-title">${state.title}</div><div class="empty-state-sub">${state.sub}</div>`;
        container.appendChild(e);
        document.getElementById('mainStats').textContent = '';
        return;
    }

    const filtered = viewFiles.filter(f =>
        f.name.toLowerCase().includes(search) ||
        f.path.toLowerCase().includes(search) ||
        f.tags.some(t => String(t).toLowerCase().includes(search))
    );

    document.getElementById('mainStats').textContent = `${filtered.length} item${filtered.length!==1?'s':''}`;

    if (!filtered.length) {
        const e = document.createElement('div'); e.className = 'empty-state';
        e.innerHTML = '<div class="empty-state-icon">🔍</div><div class="empty-state-title">No results</div><div class="empty-state-sub">Try a different search term</div>';
        container.appendChild(e); return;
    }

    const table = document.createElement('table');
    table.className = 'file-table';
    table.appendChild(buildTableHead());

    const tbody = document.createElement('tbody');
    filtered.slice().sort(compareFiles).forEach(f => tbody.appendChild(makeFileRow(f)));
    table.appendChild(tbody);

    container.appendChild(table);
}

// ── Export ─────────────────────────────────────────────────────────────────
async function downloadVault() {
    const pwd = document.getElementById('password').value;
    if (!pwd) { await modalAlert('Enter a master password before exporting.'); return; }

    const title    = document.getElementById('vaultTitle').value.trim() || 'vault';
    // Matches: echo "${APP}-${VERSION}-$(date -u +%Y%m%dT%H%MZ)"
    const fileName = `${APP}-${APP_VERSION}-${utcTimestamp()}.vault`;

    const salt = crypto.getRandomValues(new Uint8Array(16));
    const iv   = crypto.getRandomValues(new Uint8Array(12));
    const key  = await deriveKey(pwd, salt);
    const aad  = buildAAD(MAGIC_C, salt);

    const plaintext = new TextEncoder().encode(JSON.stringify({
        metadata: { title, version: APP_VERSION, timestamp: new Date().toISOString() },
        files:    vaultFiles
    }));

    const cipher = await crypto.subtle.encrypt(
        { name:'AES-GCM', iv, additionalData: aad },
        key,
        plaintext
    );

    const blob = new Blob([MAGIC_C, salt, iv, cipher], { type: 'application/octet-stream' });

    // FIX #12: showSaveFilePicker hides the tab too — save password value
    // before the picker opens so the visibility timer can't interfere.
    if (typeof window.showSaveFilePicker === 'function') {
        let handle;
        try {
            handle = await window.showSaveFilePicker({
                suggestedName: fileName,
                types: [{ description: 'Vault file', accept: { 'application/octet-stream': ['.vault'] } }]
            });
        } catch (e) {
            if (e.name === 'AbortError') return;
            await modalAlert(`❌ Export failed: ${e.message}`);
            return;
        }
        try {
            const writable = await handle.createWritable();
            await writable.write(blob);
            await writable.close();
            await modalAlert('✅ Vault exported successfully.');
        } catch (e) {
            await modalAlert(`❌ Export failed: ${e.message}`);
        }
    } else {
        const url = URL.createObjectURL(blob);
        Object.assign(document.createElement('a'), { href: url, download: fileName }).click();
        setTimeout(() => URL.revokeObjectURL(url), 5000);
    }
}

// ── Import ─────────────────────────────────────────────────────────────────
// File is picked first; the master password is asked for afterwards via a
// modal, once we know which vault file we're actually unlocking.
// FIX #2: Always clear vaultUpload — including on every early return in
// loadVault() — so the onchange fires again if the user picks the same file
// a second time.
function triggerImport() {
    const vaultUpload = document.getElementById('vaultUpload');
    vaultUpload.value = '';          // reset first so onchange always fires
    vaultUpload.onchange = loadVault;
    vaultUpload.click();
}

async function loadVault() {
    const vaultUpload = document.getElementById('vaultUpload');
    const file = vaultUpload.files[0];

    // FIX #2: clear the input unconditionally so re-picking the same file
    // triggers onchange next time regardless of which branch we exit through.
    vaultUpload.value = '';

    if (!file) return;

    if (vaultFiles.length > 0) {
        const ok = await modalConfirm(
            `Importing will replace your current vault (${vaultFiles.length} file${vaultFiles.length!==1?'s':''}).\n\nExport a backup first if needed.`,
            'Import & Replace', true
        );
        if (!ok) return;
    }

    const pwd = await modalPromptPassword(`Enter the password for "${file.name}":`, 'Master password');
    if (!pwd) return;

    let arrayBuf;
    try {
        arrayBuf = await file.arrayBuffer();
    } catch {
        await modalAlert('❌ Could not read the file. It may have been moved or is inaccessible.');
        return;
    }

    if (arrayBuf.byteLength < MIN_VAULT_BYTES) {
        await modalAlert('❌ This file is too small to be a valid vault.');
        return;
    }

    let dec;
    try {
        dec = await tryDecrypt(pwd, arrayBuf);
    } catch {
        await modalAlert('❌ Wrong password, or this file is corrupted / not a vault.');
        return;
    }

    document.getElementById('password').value = pwd;
    updateStrength();

    try {
        const imported  = JSON.parse(new TextDecoder().decode(dec));
        const rawFiles  = Array.isArray(imported.files) ? imported.files : [];

        const validFiles   = [];
        const invalidCount = rawFiles.reduce((n, entry) => {
            if (isValidFileEntry(entry)) {
                // FIX #3,4,7,8,9,10: sanitise all fields, not just validate
                validFiles.push(sanitiseEntry(entry));
                return n;
            }
            return n + 1;
        }, 0);

        vaultFiles = validFiles;

        // FIX #7: type-check title before writing to DOM
        const importedTitle = imported.metadata?.title;
        if (typeof importedTitle === 'string' && importedTitle.trim()) {
            document.getElementById('vaultTitle').value = importedTitle.trim();
        }

        setView('files');

        const warn = invalidCount > 0
            ? `\n⚠️ ${invalidCount} malformed entr${invalidCount!==1?'ies':'y'} were skipped.`
            : '';
        await modalAlert(`✅ Vault imported — ${validFiles.length} file${validFiles.length!==1?'s':''} loaded.${warn}`);
    } catch {
        await modalAlert('❌ Vault data is corrupted or in an unrecognised format.');
    }
}

// ── Auto-clear password on tab hide ───────────────────────────────────────
// FIX #5: Extend grace period to 10 s.  800 ms was too short — a user
// navigating to a deeply nested folder in the OS file picker easily takes
// longer, leaving them with a wiped password and a failed import.
// The page becoming visible again (picker closed) cancels the timer.
// FIX #12: Same timer also guards the showSaveFilePicker export flow.
let _hideTimer = null;
document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') {
        _hideTimer = setTimeout(() => {
            document.getElementById('password').value = '';
            updateStrength();
            _clearKeyCache();
            _hideTimer = null;
        }, 10000); // 10 s — enough for any file-picker navigation
    } else {
        clearTimeout(_hideTimer);
        _hideTimer = null;
    }
});

// ── Init ───────────────────────────────────────────────────────────────────
setupPWA();
renderTree();
</script>
</body>
